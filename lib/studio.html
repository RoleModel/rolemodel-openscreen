<!doctype html>
<html lang="en">

<head>
   <meta charset="utf-8" />
   <meta name="viewport" content="width=device-width,initial-scale=1" />
   <title>RoleModel Studio</title>
   <link rel="icon" href="/brand-mark.svg" />
   <!-- Vendored, not linked to a CDN: this page is hosted by a desktop app that has
        to start with no network. fonts.css binds the two families the styles below
        already name; hugeicons.css is the icon set. -->
   <link rel="stylesheet" href="/fonts.css" />
   <link rel="stylesheet" href="/optics.css" />
   <link rel="stylesheet" href="/hugeicons.css" />
   <link rel="stylesheet" href="/studio.css" />
</head>

<body class="op-page">
   <!--
      Where a finished action says so.

      Outside .op-page__main on purpose: a note rendered into the footer beside
      the buttons reflowed them every time it appeared, and a note rendered into
      a panel scrolls away with the panel. This is fixed, it never takes layout
      space, and it fades itself out.
   -->
   <output class="toast" id="toast" role="status" aria-live="polite" hidden></output>
   <div class="op-page__sidebar">
      <nav class="sidebar sidebar--drawer">
         <a class="sidebar__brand sidebar__brand--left" href="/">
            <img height="50" width="50" src="/brand-mark.svg" />
         </a>
         <h1>RoleModel Studio</h1>
         <!--
            Narrow the nav by choice, not only by window width.

            The rail already exists as a shape this nav takes under 48rem; this
            pins it at any width, for a wide window where the work wants the room
            more than the labels do.
         -->
         <button class="btn btn--no-border btn--icon sidebar__pin" data-el="railPin" type="button" aria-pressed="false" title="Minimise the sidebar"></button>
         <div class="root" id="root">…</div>
         <div class="sidebar__content sidebar__content--start">
            <button class="btn btn--no-border" data-v="library" aria-current="true">Library</button>
            <h2 class="navgroup" data-group="make">Make a video</h2>
            <button class="btn btn--no-border" data-group="make" data-v="workflow">Video</button>
            <button class="btn btn--no-border" data-group="make" data-v="voice">Voice</button>
            <button class="btn btn--no-border" data-group="make" data-v="hyperframes">Motion editor</button>
            <!-- Scenes had a label and a glyph but no way in: the only route was
                 a Canvas node's "Edit scene", so a project with no board nodes
                 could not reach its own saved scenes at all. -->
            <button class="btn btn--no-border" data-group="make" data-v="scenes">Scenes</button>
            <!-- Compose had zero routes: a running-order view nothing could reach. -->
            <button class="btn btn--no-border" data-group="make" data-v="compose">Compose</button>
            <button class="btn btn--no-border" data-group="make" data-v="restyle">Restyle</button>
            <h2 class="navgroup">Toolkit</h2>
            <button class="btn btn--no-border" data-v="skills">Skills</button>
            <button class="btn btn--no-border" data-v="brand">Brand</button>
            <!-- Wallpapers was reachable only through a Brand swatch. -->
            <button class="btn btn--no-border" data-v="wallpapers">Wallpapers</button>
            <button class="btn btn--no-border" data-v="components">Components</button>
            <button class="btn btn--no-border" data-v="storage">Storage</button>
            <button class="btn btn--no-border" data-v="usage">Usage</button>
            <button class="btn btn--no-border" data-v="console">Console<span class="badge" id="jobn"></span></button>
            
         </div>
         <div class="sidebar__content sidebar__content--end">
         <div class="tools" id="tools"></div>
            <button class="btn btn--no-border" id="docs">Docs</button>
            <button class="btn btn--no-border" id="signout" hidden>Sign out</button>
         </div>
      </nav>
   </div>

   <div class="op-page__main">
      <header class="op-page__main-header">
         <div class="op-page__header-context" id="crumbs"></div>
         <aside class="activity" id="activity" aria-live="polite" hidden></aside>
      </header>
      <main class="op-page__main-content" id="main"></main>
      <footer class="op-page__main-footer"></footer>

      <div id="editor-host" class="editor-host"></div>
   </div>
   <div class="op-page__sidebar op-page__sidebar--right"></div>
   <!--
      Panel markup, as markup.
      ================================================================
      A panel used to be assembled in JavaScript — forty lines of `el('div')` and
      `.append()` per view, where the structure was something you reconstructed by
      reading code rather than something you could see. This is the same structure
      as HTML: the shape is legible, the Optics classes are visible, and changing
      the layout is an edit here instead of a hunt through a 6,000-line file.

      `data-region` says where a block goes — `main` into the page content,
      `side` into Optics' right sidebar, `footer` into its page footer. The last
      two are OUTSIDE `.op-page__main-content`, which is the point: config and
      actions are not part of the thing that scrolls.

      `data-el` is a handle. mountPanel() returns a map of them, so the JS wires
      behaviour to named nodes and never builds any.
   -->
   <!--
      First run: no projects yet.
      ================================================================
      Shown INSTEAD of whatever panel was asked for, because every scoped panel is
      about a project and there is not one — a Scenes page with an empty footage
      shelf and a dead Save button teaches nothing except that the tool is broken.

      The art is assets/empty-state.svg, served through the same static route as
      brand/ and components/. It is decorative — the heading and the steps carry the
      meaning — so the frame is aria-hidden and the img's alt is empty rather than
      describing a picture a screen reader gains nothing from.
   -->
   <template data-panel="firstrun">
      <div data-region="main" class="panel-card firstrun">
         <div class="firstrun__art" aria-hidden="true">
            <img data-el="art" src="/assets/empty-state.svg" alt="" />
         </div>
         <h2 class="firstrun__title">Make your first video</h2>
         <p class="firstrun__lede">
            Everything here happens inside a project — a folder with your footage,
            scripts, scenes and renders in it. Make one and the rest of the app has
            somewhere to put things.
         </p>
         <ol class="firstrun__steps">
            <li><strong>Record or drop in footage.</strong> A screen capture, or files you already have.</li>
            <li><strong>Write the script.</strong> Or describe the video and let Claude draft it.</li>
            <li><strong>Give it a voice.</strong> Narration is synthesised from the script.</li>
            <li><strong>Build the scenes.</strong> Titles, callouts and brand boards.</li>
            <li><strong>Assemble and review.</strong> Cut it together, then share it.</li>
         </ol>
      </div>
      <div data-region="footer">
         <div data-el="status" class="hint"></div>
         <button data-el="start" class="btn">Create a project</button>
      </div>
   </template>

   <template data-panel="components">
      <p class="lede" data-region="main">
         Custom elements for HyperFrames scenes: title cards, browser chrome, lower
         thirds, callouts, stats, build-on lists. Drag the scrubber in the frame —
         the page is seeked to that instant, which is exactly what the renderer does
         frame by frame.
      </p>
      <div data-region="main">
         <iframe data-el="gallery" class="tall-frame" src="/components/gallery.html" title="Component gallery"></iframe>
         <pre class="cmd-note">node components/render-scene.mjs components/scene.html -o demo.mp4 --fps 30</pre>
      </div>
      <div data-region="footer">
         <button data-el="openTab" class="btn">Open in a tab</button>
         <button data-el="openScene" class="btn ghost">Open the scene template</button>
         <button data-el="openField" class="btn ghost">Design an animated field</button>
         <button data-el="openHaze" class="btn ghost">Design a pixel haze</button>
      </div>
   </template>

   <template data-panel="new">
      <p class="lede" data-region="main">
         A project is a folder with a manifest. Client is separate from project name
         — Ridgeline and Hershey are two clients, not one project.
      </p>
      <div data-region="main" class="form">
         <div class="form-group">
            <label class="form-label" for="new-name">Project</label>
            <input data-el="name" id="new-name" class="form-control" placeholder="Railing Case Study" />
         </div>
         <div class="form-group">
            <label class="form-label" for="new-client">Client</label>
            <input data-el="client" id="new-client" class="form-control" placeholder="Ridgeline" />
         </div>
         <div class="form-group">
            <label class="form-label" for="new-brand">Brand</label>
            <select data-el="brand" id="new-brand" class="form-control"></select>
         </div>
         <div class="form-group">
            <label class="form-label" for="new-store">Storage</label>
            <select data-el="store" id="new-store" class="form-control"></select>
         </div>
         <div class="form-group">
            <label class="form-label" for="new-bucket">Bucket</label>
            <input data-el="bucket" id="new-bucket" class="form-control" placeholder="rm-video (remote only)" />
         </div>
      </div>
      <div data-region="footer">
         <pre data-el="status" class="status" hidden></pre>
         <button data-el="go" class="btn">Create project</button>
      </div>
   </template>

   <!--
      Three ways in, as three cards.
      ================================================================
      This was a row of chips above whichever panel was active, so the choice and
      the work competed for the same screen and the two you did not pick sat there
      taking width. A picture says which is which faster than three similar
      sentences do — and the difference between recording a screen, writing a
      script and replaying a test is exactly the kind that is easier shown.

      The chooser is what you see with nothing picked; picking one replaces it, and
      the breadcrumb is the way back. `<img>` with an empty alt because the name is
      right beneath it in text — reading the picture out as well would say it twice.
   -->
   <template data-panel="create">
      <p class="lede" data-region="main">
         Three ways to start. Record what you do, write it and let the browser act
         it out, or replay a test you already have.
      </p>
      <div data-el="chooser" data-region="main" class="choose-grid">
         <button class="choose-card" data-tab="record">
            <img src="/assets/screen-recording.svg" alt="" />
            <span class="choose-card__name">Record a screen</span>
            <span class="choose-card__note">Capture what you do, as you do it.</span>
         </button>
         <button class="choose-card" data-tab="make">
            <img src="/assets/script.svg" alt="" />
            <span class="choose-card__name">Make from a script</span>
            <span class="choose-card__note">Write the demo; the browser performs it.</span>
         </button>
         <button class="choose-card" data-tab="recast">
            <img src="/assets/test.svg" alt="" />
            <span class="choose-card__name">From a test</span>
            <span class="choose-card__note">Replay a Playwright run you already have.</span>
         </button>
      </div>
      <div data-el="host" data-region="main"></div>
   </template>

   <template data-panel="scripts">
      <p class="lede" data-region="main">
         Narration and outlines as markdown — greppable, and they diff. A script
         saved to a project lands in that project's scripts/ folder; the shared
         shelf is for the ones that travel. Voice reads from here.
      </p>

      <div data-region="main" class="panel-card script-form">
         <div class="form-group">
            <label class="form-label" for="script-about">About</label>
            <textarea data-el="about" id="script-about" class="form-control" rows="3"
               placeholder="A URL, or a couple of sentences about what the video is for and who is watching."></textarea>
            <div class="form-hint">The brief Claude drafts from. Type / for a directive.</div>
         </div>

         <div class="form-group">
            <label class="form-label" for="script-body">Script</label>
            <textarea data-el="body" id="script-body" class="form-control script-body" spellcheck="false"
               placeholder="Write the script…"></textarea>
            <div data-el="count" class="form-hint"></div>
			<div class="form-hint">Type <code>/speaker "Name"</code> before a section to assign it to that person. Claude keeps those sections with that person’s named footage.</div>
         </div>

         <div data-el="draftOut"></div>
      </div>

      <!--
         The rail is the settings and the shelf.
         Main is where you write; the name, the length and where it saves are knobs
         about the thing being written, not the thing itself.
      -->
      <div data-region="side">
         <div class="form-group">
            <label class="form-label" for="script-name">Name</label>
            <input data-el="name" id="script-name" class="form-control" placeholder="case-study-opener" />
            <div class="form-hint">The filename, without .md. Voice matches a narration run to a script by this.</div>
         </div>
         <div class="form-group">
            <label class="form-label" for="script-shelf">Save to</label>
            <select data-el="shelf" id="script-shelf" class="form-control">
               <option value="project">This project</option>
               <option value="shared">Shared shelf</option>
            </select>
            <div class="form-hint">
               A project script lands in its scripts/ folder. The shared shelf is for the
               ones that travel between projects.
            </div>
         </div>
         <div class="form-group">
            <label class="form-label" for="script-seconds">Seconds</label>
            <input data-el="seconds" id="script-seconds" class="form-control" type="number" value="30" min="10" max="180"
               step="5" />
            <div class="form-hint">How long the draft should run. Drafting only.</div>
         </div>

         <div class="client">Saved</div>
         <div data-el="saved" class="saved-list"></div>
      </div>

      <div data-region="footer">
         <div data-el="status" class="hint"></div>
         <button data-el="draft" class="btn ghost">Draft it with Claude</button>
         <button data-el="save" class="btn">Save script</button>
         <button data-el="build" class="btn btn--primary">Build with Claude</button>
      </div>
   </template>

   <template data-panel="scenes">
      <p class="lede" data-region="main">
         A scene is a stage with parts on it. Add a part, fill it in, watch it.
         Everything is seeked rather than played, so what you scrub to is what
         gets encoded.
      </p>

      <div data-region="main" class="panel-card panel-stage">
         <iframe data-el="frame" class="scene-frame" title="Scene preview"></iframe>
         <div class="row">
            <input data-el="scrub" class="form-control" type="range" min="0" max="8000" step="16" value="0"
               aria-label="Scrub the scene" />
            <span data-el="time" class="path">0 ms</span>
         </div>
         <div data-el="palette" class="row">
            <span class="path">Add a part</span>
         </div>
         <div data-el="cards" class="panel-cards"></div>
         <!-- Visible because an editor that cannot show its output is one nobody
              can debug; collapsed because it is no longer the thing you work in. -->
         <details data-el="raw">
            <summary>Markup</summary>
            <textarea data-el="rawText" class="form-control" rows="6" spellcheck="false"></textarea>
         </details>
      </div>

      <div data-region="side">
         <div class="form-group">
            <label class="form-label" for="scene-pick">Scene</label>
            <select data-el="pick" id="scene-pick" class="form-control"></select>
            <div class="form-hint">Saved in the project under scenes/.</div>
         </div>
         <div class="form-group">
            <label class="form-label" for="scene-name">Name</label>
            <input data-el="name" id="scene-name" class="form-control" placeholder="opening-card" />
         </div>
         <div class="form-group">
            <label class="form-label" for="scene-wallpaper">Wallpaper</label>
            <select data-el="wallpaper" id="scene-wallpaper" class="form-control"></select>
         </div>
         <div class="form-group">
            <label class="form-label" for="scene-brand">Brand</label>
            <select data-el="brand" id="scene-brand" class="form-control">
               <option value="">RoleModel — DM Sans</option>
               <option value="academy">Craftsmanship Academy — Space Grotesk</option>
            </select>
            <div class="form-hint">Academy scenes set in Space Grotesk. RoleModel keeps DM Sans.</div>
         </div>
         <div class="form-group">
            <label class="form-label">Accent</label>
            <div data-el="accent"></div>
            <div class="form-hint">The brand colour the parts pick up. Leave it unset for the preset default.</div>
         </div>
         <div class="form-group">
            <label class="form-label" for="scene-brief">Ask Claude for one</label>
            <textarea data-el="brief" id="scene-brief" class="form-control" rows="3"
               placeholder="What is this scene? One or two sentences."></textarea>
         </div>
         <div data-el="footageGroup" class="form-group" hidden>
            <label class="form-label" for="scene-footage">Footage for this Canvas shot</label>
            <select data-el="footage" id="scene-footage" class="form-control"></select>
            <div class="row">
               <button data-el="transcribeFootage" type="button" class="btn btn--small">Transcribe</button>
               <button data-el="suggestFootage" type="button" class="btn ghost btn--small">Ask Claude to find it</button>
               <button data-el="attachFootage" type="button" class="btn ghost btn--small">Use whole file</button>
               <button data-el="addFootage" type="button" class="btn ghost btn--small">Add video</button>
               <input data-el="footagePicker" type="file" accept="video/*" hidden />
            </div>
            <div data-el="footageHint" class="form-hint"></div>
            <section data-el="footageReview" class="scene-footage-review" hidden>
               <video data-el="footagePlayer" class="scene-footage-review__player" controls playsinline preload="metadata"></video>
               <div data-el="footageReviewStatus" class="form-hint"></div>
               <div data-el="footageTranscript" class="scene-footage-review__transcript"></div>
            </section>
         </div>
      </div>

      <div data-region="footer">
         <pre data-el="status" class="status" hidden></pre>
         <button data-el="draft" class="btn">Draft it with Claude</button>
         <button data-el="restore" class="btn ghost" type="button" hidden>Restore previous save</button>
         <button data-el="save" class="btn ghost">Save scene</button>
      </div>
   </template>

   <!--
      Skills: the first panel of the second batch. Everything static is here; the
      card list is cloned per skill from the row template beneath, so JS fills
      text and toggles buttons but builds no structure.
   -->
   <template data-panel="skills">
      <p class="lede" data-region="main">
         Shared instructions Claude uses across RoleModel Studio. Install a zip once,
         edit its instructions here, and every signed-in teammate gets the same skill.
      </p>

      <div class="row" data-region="main">
         <button data-el="install" class="btn btn--primary" type="button">Install skill .zip</button>
         <input data-el="picker" type="file" accept=".zip,application/zip" hidden />
         <button data-el="refresh" class="btn ghost" type="button">Refresh</button>
         <span data-el="status" class="hint">Checking the shared skill directory…</span>
      </div>

      <div class="client" data-region="main">Studio skills</div>
      <div data-el="list" class="grid" data-region="main"></div>

      <section data-el="editor" class="client" data-region="main" hidden>
         <div class="row">
            <strong data-el="editorName">Skill editor</strong>
            <span data-el="editorNote" class="hint"></span>
         </div>
         <textarea data-el="editorField" class="form-control" rows="22" spellcheck="false"></textarea>
         <div class="row">
            <button data-el="save" class="btn btn--primary" type="button">Save shared skill</button>
            <button data-el="close" class="btn ghost" type="button">Close</button>
         </div>
      </section>

      <div class="client" data-region="main">Standard shared skills</div>
      <div data-el="standard" class="hint" data-region="main"></div>
      <div class="client" data-region="main">Supporting skills</div>
      <div data-el="support" class="hint" data-region="main"></div>
   </template>

   <!-- One skill card. Cloned by mountRow('skill-card'); the view fills the text. -->
   <template data-row="skill-card">
      <article class="card">
         <div class="body">
            <div data-el="name" class="nm"></div>
            <div data-el="description" class="path"></div>
            <div data-el="source" class="path"></div>
            <span data-el="kind" class="kind"></span>
            <div class="row">
               <button data-el="edit" class="btn ghost" type="button">Edit</button>
               <button data-el="publish" class="btn ghost" type="button" hidden>Publish to team</button>
            </div>
         </div>
      </article>
   </template>

   <template data-panel="workflow">
      <p class="lede" data-region="main">The path is always in the header. This is only the next useful move.</p>
      <section class="workflow workflow--next" data-region="main">
         <section data-el="panel" class="workflow__panel"></section>
      </section>
   </template>

   <!-- The hub's one card, cloned on every draw: the next useful move. -->
   <template data-row="workflow-step">
      <div>
         <div data-el="eyebrow" class="workflow__eyebrow"></div>
         <h2 data-el="title" class="workflow__title"></h2>
         <p data-el="body" class="workflow__body"></p>
         <p class="workflow__status"><strong data-el="state"></strong><span data-el="detail"></span></p>
         <div class="row">
            <button data-el="proceed" class="btn btn--primary" type="button"></button>
            <button data-el="editor" class="btn ghost" type="button" hidden>Open visual timeline</button>
            <button data-el="restart" class="btn ghost" type="button"
               title="Archive this video’s working plan and begin again with the same media">Start over</button>
         </div>
         <p data-el="progress" class="workflow__action-note"></p>
      </div>
   </template>

   <template data-panel="scene-gallery">
      <p data-el="lede" class="lede" data-region="main"></p>
      <div data-el="grid" class="grid" data-region="main">
         <button data-el="add" class="card cardnew" type="button">
            <div class="nm">New scene</div>
            <div class="path">start from the components</div>
         </button>
      </div>
      <p data-el="empty" class="empty" data-region="main" hidden>No scenes yet. Build one and it lands here, and in Compose.</p>
   </template>

   <!-- One scene card. The frame is drawn at 1920×1080 and scaled, never reflowed. -->
   <template data-row="scene-card">
      <div class="card" style="cursor:pointer">
         <div class="thumbwrap">
            <div data-el="shot" class="thumb" style="display:block;position:relative;overflow:hidden;background:var(--sunk)">
               <iframe data-el="frame" loading="lazy" scrolling="no" hidden
                  style="inline-size:1920px;block-size:1080px;border:0;transform-origin:top left;pointer-events:none;position:absolute;inset-block-start:0;inset-inline-start:0"></iframe>
            </div>
            <span class="kind">scene</span>
         </div>
         <div class="body">
            <div data-el="name" class="nm"></div>
            <div data-el="path" class="path"></div>
         </div>
      </div>
   </template>

   <!-- The three ways a designed component leaves a designer page: insert into a
        composition, copy the tag, save as a scene. Cloned by sceneOutlets(). -->
   <template data-row="scene-outlets">
      <div style="display:contents">
         <select data-el="target" class="form-control"></select>
         <select data-el="where" class="form-control">
            <option value="end">At the end</option>
            <option value="playhead">At the playhead</option>
         </select>
         <button data-el="insert" class="btn" type="button" disabled>Insert into composition</button>
         <button data-el="copy" class="btn ghost" type="button">Copy tag</button>
         <input data-el="name" class="form-control" placeholder="scene name" />
         <button data-el="save" class="btn" type="button">Save as scene</button>
      </div>
   </template>

   <!-- One Optics form group, cloned by field(). The control node is handed in
        by the caller; a boolean control is reordered inline by the same rules
        field() has always applied. -->
   <template data-row="form-group">
      <div class="form-group">
         <label data-el="label" class="form-label"></label>
      </div>
   </template>

   <!-- The one-line confirmation about a handover that just happened. -->
   <template data-row="handoff-note">
      <p class="hint"></p>
   </template>

   <!-- A compact Optics switch. The track's label is visually hidden by Optics
        and gives the input its accessible name. -->
   <template data-row="small-switch">
      <div class="switch switch--small">
         <input data-el="input" type="checkbox" />
         <label data-el="label"></label>
      </div>
   </template>

   <template data-panel="interview">
      <p class="lede" data-region="main">
         Answer a few practical questions about the video. Claude turns the conversation
         into a plan, then uses that plan to draft the script.
      </p>
      <p data-el="skillHint" class="hint" data-region="main"></p>
      <div class="form interview" data-region="main">
         <section class="interview__question full">
            <div data-el="questionCount" class="interview__count" hidden></div>
            <div data-el="questionTitle" class="paper-edit__title" hidden></div>
            <p data-el="questionHint" class="hint" hidden></p>
         </section>
         <div data-el="answerGroup" class="form-group">

      <p data-el="lede" class="lede" data-region="main">Everything the Studio runs, as it runs. Output is live — you don't have to go find a terminal to see whether the export worked.</p>

   <!-- One clip: running-order controls, and the folded-away rough trim whose
        handles seek the video as they move. -->
   <template data-row="cut-clip">
      <div class="card">
         <div data-el="body" class="body">
            <div class="row">
               <div data-el="title" class="nm"></div>
               <button data-el="up" class="btn ghost" type="button" title="Move earlier">↑</button>

               <button data-el="kill" class="btn ghost del" type="button">Remove</button>
            </div>
            <details data-el="trim">
               <summary style="cursor:pointer;color:var(--op-color-neutral-minus-four);font-size:var(--op-font-x-small)">Rough in and out (optional)</summary>
               <!-- Sized by the picture, not by the panel, so the card is not black bars. -->
               <video data-el="video" preload="metadata" muted playsinline style="inline-size:auto;max-inline-size:100%;display:block;margin-inline:auto;border-radius:var(--op-radius-medium)"></video>
               <!-- The whole recording, with the kept span lit and a handle at each
                    end. The handles stand proud of the bar, in the opposite colour,
                    so they read as the two things on it you are meant to grab. -->
               <div data-el="strip" style="position:relative;block-size:2.25rem;margin-block:calc(var(--op-space-x-small) + 0.25rem) var(--op-space-x-small);background:var(--op-color-neutral-plus-six);border-radius:var(--op-radius-small);cursor:pointer;touch-action:none;user-select:none">
                  <div data-el="kept" style="position:absolute;inset-block:0;background:var(--op-color-primary-base);opacity:0.55;border-radius:var(--op-radius-small)"></div>
                  <div data-el="playhead" style="position:absolute;inset-block:0;inline-size:2px;background:var(--op-color-neutral-base);pointer-events:none"></div>
                  <div data-el="hIn" data-side="in" role="slider" aria-label="Trim from the start" tabindex="0" style="position:absolute;inset-block:-0.25rem;inline-size:0.6rem;background:var(--op-color-academy-primary-base);border:1px solid var(--op-color-primary-base);border-radius:var(--op-radius-small);cursor:ew-resize;touch-action:none;box-shadow:0 1px 3px rgb(0 0 0 / 0.45)"></div>
                  <div data-el="hOut" data-side="out" role="slider" aria-label="Trim from the end" tabindex="0" style="position:absolute;inset-block:-0.25rem;inline-size:0.6rem;background:var(--op-color-academy-primary-base);border:1px solid var(--op-color-primary-base);border-radius:var(--op-radius-small);cursor:ew-resize;touch-action:none;box-shadow:0 1px 3px rgb(0 0 0 / 0.45)"></div>
               </div>
               <div class="row"><span data-el="label" class="path"></span><span data-el="at" class="hint"></span></div>
               <div class="row">
                  <button data-el="play" class="btn ghost" type="button">Play the trim</button>
                  <button data-el="setIn" class="btn ghost" type="button" title="Trim the start to the frame on screen">In here</button>
                  <button data-el="setOut" class="btn ghost" type="button" title="Trim the end to the frame on screen">Out here</button>
                  <button data-el="whole" class="btn ghost" type="button">Whole file</button>

   <template data-row="colormenu-swatch"><button class="colormenu__swatch" type="button" role="option"></button></template>
   <template data-row="colormenu-swatch-none"><button class="colormenu__swatch colormenu__swatch--none" type="button" role="option">—</button></template>
   <template data-row="colormenu-swatch-dead"><button class="colormenu__swatch colormenu__swatch--dead" type="button" disabled></button></template>

   <template data-panel="project">
      <div class="project-head" data-region="main">
         <p data-el="lede" class="lede"></p>
         <p data-el="storageStatus" class="hint" hidden></p>
      </div>
      <div class="row margin-y-md" style="justify-content:space-between;flex-wrap:wrap;gap:var(--op-space-small)" data-region="main">
         <div class="btn-group">
            <button data-el="addRecentCapture" class="btn ghost btn--pill" type="button">Add recording</button>
            <button data-el="reindex" class="btn ghost btn--pill" type="button">Re-index</button>
         </div>
         <div data-el="filters" class="btn-group" style="margin-inline-start:auto"></div>
      </div>
      <details data-el="recentCaptures" class="project-capture-import" data-region="main">
         <summary>Choose a recent OpenScreen recording</summary>
         <div class="project-capture-import__controls">
            <select data-el="captureSelect" aria-label="Recent OpenScreen recordings" disabled></select>
            <button data-el="addCapture" class="btn secondary btn--small" type="button" disabled>Add to project</button>
            <button data-el="refreshCaptures" class="btn ghost btn--small" type="button">Refresh</button>
         </div>
         <p data-el="captureHint" class="hint project-capture-import__status" hidden></p>
      </details>
      <div class="full" data-region="main">
         <button data-el="drop" class="dropzone" type="button">
            <span class="dropzone__lead">Add other media</span>
            <span class="dropzone__sub">Drop or choose video, audio or stills</span>
         </button>
         <input data-el="picker" type="file" multiple accept="video/*,audio/*,image/*" hidden />
         <div data-el="dropHint" class="hint"></div>
      </div>
      <div data-el="rootPath" class="path" data-region="main"></div>
      <p data-el="emptyNote" class="empty" data-region="main" hidden></p>
      <div data-el="grid" class="grid" data-region="main"></div>
   </template>

   <!-- What is picked, and the one thing to do with it. -->
   <template data-row="pickbar">
      <div class="pickbar">
         <span data-el="count" class="status"></span>
         <button data-el="clear" class="btn ghost" type="button">Clear</button>
         <button data-el="make" class="btn" type="button">Make a video from these</button>
      </div>
   </template>

   <!-- A script, as a card on the project shelf. -->
   <template data-row="script-shelf-card">
      <div class="card">
         <div class="thumbwrap">
            <div data-el="thumb" class="thumb" style="display:grid;place-items:center;background:var(--sunk)"></div>
            <span class="kind">script</span>
         </div>
         <div class="body">
            <div data-el="name" class="nm"></div>
            <div data-el="meta" class="path"></div>
         </div>
      </div>
   </template>

   <!-- One file on the project shelf: pickable, playable in place, one menu. -->
   <template data-row="file-card">
      <div class="card" style="cursor:pointer">
         <input data-el="pick" class="card__pick" type="checkbox" title="Use this in a video" />
         <div class="thumbwrap">
            <div data-el="thumb" class="thumb"></div>
            <span data-el="kind" class="kind"></span>
            <button data-el="play" class="thumbwrap__play" type="button" hidden></button>
         </div>
         <div class="body">
            <div data-el="name" class="nm"></div>
            <div data-el="path" class="path"></div>
            <div data-el="meta" class="meta"></div>
            <div data-el="note" class="path" style="flex-basis:100%"></div>
         </div>
      </div>
   </template>

   <!-- One modal asking one question about one asset: move, or rename. -->
   <template data-row="asset-dialog">
      <dialog class="move-asset">
         <form class="move-asset__form" method="dialog">
            <h2 data-el="title"></h2>
            <p data-el="lede" class="hint"></p>
            <label class="form-group">
               <span data-el="label" class="form-label"></span>
               <span data-el="slot" style="display:contents"></span>
            </label>
            <p data-el="status" class="hint" hidden></p>
            <div class="move-asset__actions">
               <button data-el="cancel" class="btn ghost" type="button">Cancel</button>
               <button data-el="confirm" class="btn" type="button"></button>
            </div>
         </form>
      </dialog>
   </template>

   <template data-row="media-name-dialog">
      <dialog class="media-name-dialog">
         <form class="media-name-dialog__form" method="dialog">
            <h2 data-el="title"></h2>
            <p class="hint">Use the person’s name when it matters. Claude sees these names when it matches footage to /speaker sections in the script.</p>
            <div data-el="fields" style="display:contents"></div>
            <p data-el="status" class="hint" hidden></p>
            <div class="move-asset__actions">
               <button data-el="cancel" class="btn ghost" type="button">Cancel</button>
               <button data-el="add" class="btn btn--primary" type="button"></button>
            </div>
         </form>
      </dialog>
   </template>

   <template data-row="media-name-field">
      <label class="form-group">
         <span class="form-label">Save as</span>
         <div class="media-name-dialog__name">
            <input data-el="input" class="form-control" />
            <span data-el="extension" class="media-name-dialog__extension"></span>
         </div>
         <span data-el="original" class="form-hint"></span>
      </label>
   </template>

   <template data-row="control-audio"><audio></audio></template>

   <!-- Watch or listen in place: video, or a waveform for audio. -->
   <template data-row="player-dialog">
      <dialog class="player">
         <div class="player__frame">
            <div class="player__bar">
               <span data-el="name" class="player__name"></span>
               <button data-el="close" class="btn ghost btn--small" type="button" aria-label="Close the player"></button>
            </div>
            <video data-el="video" class="player__video" hidden></video>
            <div data-el="listen" class="wave" hidden>
               <div data-el="canvas" class="wave__canvas"></div>
               <div class="wave__row">
                  <button data-el="play" class="btn ghost btn--small wave__play" type="button"></button>
                  <span data-el="clock" class="wave__clock">0:00</span>
               </div>
            </div>
         </div>
      </dialog>
   </template>

   <template data-row="control-img"><img alt="" loading="lazy" /></template>

   <!-- Claude's proposed passages for a Canvas scene, and the manual selection. -->
   <template data-row="scene-suggestions">
      <div class="scene-footage-review__suggestions"><strong>Claude’s proposed passages</strong></div>
   </template>
   <template data-row="scene-suggestion">
      <div class="scene-footage-review__suggestion">
         <button data-el="use" class="btn ghost btn--small" type="button"></button>
         <span data-el="text"></span>
      </div>
   </template>
   <template data-row="scene-manual">
      <div class="scene-footage-review__manual">
         <span data-el="hint" class="hint"></span>
         <button data-el="use" class="btn btn--small" type="button"></button>
         <button data-el="clear" class="btn ghost btn--small" type="button">Clear</button>
      </div>
   </template>

   <!-- One part of a scene: a summary row until you open it. -->
   <template data-row="scene-part">
      <details class="card">
         <summary style="cursor:pointer;display:flex;gap:var(--op-space-x-small);align-items:baseline;padding:var(--op-space-small);">
            <span data-el="tag" class="nm"></span><span data-el="when" class="path"></span><span data-el="first" class="path" style="color:var(--fg)"></span>
         </summary>
         <div class="body">
            <div data-el="grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,11rem),1fr));gap:var(--op-space-2x-small)"></div>
            <!-- After the fields: reordering and removing are things you do to a
                 part you have already read. -->
            <div class="row" style="margin-top:var(--op-space-x-small)">
               <button data-el="up" class="btn ghost" type="button" title="Earlier in the stack">↑</button>
               <button data-el="down" class="btn ghost" type="button" title="Later in the stack">↓</button>
               <button data-el="kill" class="btn btn--icon ghost del kill" type="button" aria-label="Remove this part" title="Remove this part"></button>
            </div>
         </div>
      </details>
   </template>

   <!-- A picture is picked, not spelled: the whole card width, scrolling sideways. -->
   <template data-row="scene-image-field">
      <div class="form-group" style="grid-column:1 / -1">
         <label data-el="label" class="form-label"></label>
         <div data-el="strip" style="display:flex;gap:var(--op-space-x-small);overflow-x:auto;padding-block-end:var(--op-space-2x-small);scrollbar-width:thin"></div>
         <button data-el="upload" class="btn ghost" type="button" hidden>Upload an image</button>
         <input data-el="picker" type="file" accept="image/*" hidden />
      </div>
   </template>
   <template data-row="scene-image-tile">
      <button type="button" style="flex:0 0 auto;inline-size:6.5rem;display:flex;flex-direction:column;gap:0.35rem;align-items:center;padding:0.4rem;cursor:pointer;border-radius:var(--op-radius-medium);background:var(--op-color-neutral-plus-six);color:var(--op-color-neutral-minus-two);border:1px solid var(--op-color-neutral-plus-four)">
         <div data-el="frame" style="inline-size:100%;block-size:3.5rem;display:grid;place-items:center;overflow:hidden"></div>
         <span data-el="cap" style="font-size:var(--op-font-2x-small);line-height:1.2;text-align:center;overflow-wrap:anywhere"></span>
      </button>
   </template>

   <!-- A position is dragged, not typed; two columns so there is room to aim. -->
   <template data-row="scene-range-field">
      <div class="form-group" style="grid-column:span 2">
         <label data-el="label" class="form-label"></label>
         <div class="range-row">
            <input data-el="slider" class="form-control form-control--small" type="range" />
            <span data-el="readout" class="path"></span>
         </div>
      </div>
   </template>

   <template data-row="projmenu-item">
      <button class="projmenu__item" type="button" role="menuitem">
         <span data-el="text" class="projmenu__text"></span>
         <span data-el="note" class="projmenu__note" hidden></span>
      </button>
   </template>
   <template data-row="projmenu-sep"><div class="projmenu__sep"></div></template>

   <template data-panel="multi-assembly">
      <p class="lede" data-region="main">Choose up to eight project recordings. Studio transcribes and samples their screens in the background, then Claude returns a reviewable set of timestamped selects — never invented footage.</p>
      <button data-el="switchMode" class="btn ghost btn--small margin-bottom-md" type="button" data-region="main">Use one recording instead</button>
      <p data-el="noVideos" class="empty" data-region="main" hidden>Add recordings to this project first.</p>
      <div data-el="sourceHeader" class="multi-assembly__source-header" data-region="main" hidden>
         <div class="paper-edit__title">Source recordings · choose up to 8</div>
         <button data-el="updateSources" class="btn ghost btn--small" type="button" hidden>Update selected recordings</button>
      </div>
      <div data-el="sourceList" class="multi-assembly__sources" data-region="main" hidden></div>
      <section data-el="setup" class="multi-assembly__setup" data-region="main" hidden>
         <div data-el="scriptGroup" class="form-group" hidden>
            <label class="form-label">Script to match</label>
            <select data-el="scriptSelect" class="form-control"></select>
            <div class="form-hint">Choose this when the recordings are takes of a script. Studio applies the Video from script workflow: script order wins, missing beats stay visible, and unused material is parked for later.</div>
         </div>
      </section>
   </template>

   <!-- One selectable source recording. -->
   <template data-row="assembly-source">
      <label class="multi-assembly__source">
         <input data-el="input" type="checkbox" />
         <span data-el="thumb" class="multi-assembly__source-thumb"></span>
         <span class="multi-assembly__source-details">
            <span data-el="name" class="multi-assembly__source-name"></span>
            <span data-el="meta" class="multi-assembly__source-meta"></span>
            <span data-el="readiness" class="multi-assembly__source-ready">Not prepared</span>
         </span>
      </label>
   </template>

   <!-- The second workflow: align an audio recording to a screen recording. -->
   <template data-row="assembly-align">
      <details class="multi-assembly__align">
         <summary>Align an audio recording to a screen recording</summary>
         <p class="hint">Studio first transcribes the narration and samples the screen. Claude maps each spoken range to a matching on-screen moment; it does not lay the entire audio over the original recording.</p>
         <div data-el="row" class="multi-assembly__align-row">
            <select data-el="screen"></select>
            <select data-el="audio"></select>
            <select data-el="script"></select>
            <button data-el="build" class="btn ghost btn--small" type="button">Build visual alignment</button>
         </div>
      </details>
   </template>

   <!-- The assembly's recovery card: what the last pass left, and the way on. -->
   <template data-row="assembly-recovery">
      <section class="card card--padded">
         <div data-el="title" class="paper-edit__title"></div>
         <p data-el="copy" class="hint"></p>
         <ul data-el="gaps" class="multi-assembly__script-gaps" hidden></ul>
         <div data-el="actions" class="row">
            <button data-el="retry" class="btn btn--primary btn--small" type="button">Make a new Claude pass</button>
         </div>
      </section>
   </template>

   <!-- The review head: the cut's title, the script beats, and its actions. -->
   <template data-row="assembly-head">
      <section class="card card--padded">
         <div data-el="title" class="paper-edit__title"></div>
         <p data-el="next" class="hint"></p>
         <div data-el="beats" class="multi-assembly__script-status" hidden></div>
         <div data-el="actions" class="row">
            <button data-el="revise" class="btn ghost btn--small" type="button">Revise from comments</button>
            <button data-el="newPass" class="btn ghost btn--small" type="button">Make a new pass</button>
         </div>
      </section>
   </template>
   <template data-row="assembly-beat"><span class="multi-assembly__script-beat"></span></template>

   <!-- One audible player, one sequence, and the transcript alongside it. -->
   <template data-row="assembly-review">
      <section class="multi-assembly__review-surface">
         <div data-el="timeline" class="multi-assembly__timeline" aria-label="Assembly timeline"></div>
         <div data-el="fillers" class="multi-assembly__fillers" hidden>
            <p data-el="fillersHint" class="hint"></p>
         </div>
         <div class="multi-assembly__review-body">
            <div class="multi-assembly__stage">
               <video data-el="player" class="multi-assembly__review-player" controls playsinline preload="metadata" aria-label="Selected assembly passage"></video>
               <p data-el="selectedLabel" class="multi-assembly__selected-label"></p>
               <p data-el="selectedText" class="multi-assembly__selected-text"></p>
               <p data-el="selectedReason" class="multi-assembly__selected-reason"></p>
               <button data-el="playSelection" class="btn ghost btn--small" type="button">Play Claude’s selection</button>
               <button data-el="removeSelection" class="btn ghost btn--small" type="button">Remove from assembly</button>
               <textarea data-el="comment" class="multi-assembly__comment" rows="2" placeholder="Comment for the next edit…"></textarea>
            </div>
            <div class="multi-assembly__transcript">
               <div class="multi-assembly__transcript-head">
                  <strong data-el="transcriptName"></strong>
                  <span class="multi-assembly__transcript-hint">The green range is what Claude selected.</span>
               </div>
               <div data-el="transcriptLines" class="multi-assembly__transcript-lines"></div>
            </div>
         </div>
      </section>
   </template>
   <template data-row="assembly-cue">
      <button class="multi-assembly__transcript-line" type="button">
         <time data-el="time"></time>
         <span data-el="copy" class="multi-assembly__transcript-copy"></span>
      </button>
   </template>
   <template data-row="assembly-badge"><span class="multi-assembly__selection-badge">Claude selected</span></template>
   <template data-row="assembly-pick">
      <button class="multi-assembly__timeline-pick" type="button">
         <span data-el="number" class="multi-assembly__timeline-number"></span>
         <span data-el="label" class="multi-assembly__timeline-label"></span>
         <span data-el="time" class="multi-assembly__timeline-time"></span>
      </button>
   </template>
   <template data-row="assembly-filler">
      <div class="multi-assembly__filler">
         <span data-el="text" class="multi-assembly__filler-text"></span>
         <button data-el="trim" class="btn btn--small" type="button"></button>
      </div>
   </template>

   <!-- The visual-alignment review: the screen recording and its mapped cuts. -->
   <template data-row="assembly-alignment">
      <div style="display:contents">
         <div class="card card--padded multi-assembly__review-head">
            <div>
               <div data-el="title" class="paper-edit__title"></div>
               <p class="hint">Edit the screen cuts and narration together in HyperFrames. Rendered review video includes the matching narration.</p>
            </div>
            <div data-el="actions" class="multi-assembly__alignment-actions"></div>
         </div>
         <div class="multi-assembly__alignment-body">
            <video data-el="player" class="multi-assembly__alignment-video" playsinline controls preload="metadata"></video>
            <div data-el="cuts" class="multi-assembly__alignment-cuts"></div>
         </div>
      </div>
   </template>
   <template data-row="assembly-alignment-cut">
      <button class="multi-assembly__alignment-cut" type="button">
         <span data-el="number" class="multi-assembly__alignment-number"></span>
         <span data-el="range" class="multi-assembly__alignment-range"></span>
         <span class="multi-assembly__alignment-detail">
            <strong data-el="screen"></strong>
            <span data-el="reason"></span>
         </span>
      </button>
   </template>

   <!-- Vendored, not a CDN: see brand/vendor/README.md. UMD, so it sets a
        WaveSurfer global and must load before studio.js uses it. -->
   <script src="/brand/vendor/wavesurfer.min.js"></script>
   <script src="/studio.js"></script>
</body>

</html>
