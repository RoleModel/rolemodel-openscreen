<!doctype html>
<html lang="en">

<head>
   <meta charset="utf-8" />
   <meta name="viewport" content="width=device-width,initial-scale=1" />
   <title>RoleModel Studio</title>
   <link rel="icon" href="/brand-mark.svg" />
   <!-- Vendored, not linked to a CDN: this page is hosted by a desktop app that has
        to start with no network. fonts.css binds the two families the styles below
        already name; hugeicons.css is the icon set. -->
   <link rel="stylesheet" href="/fonts.css" />
   <link rel="stylesheet" href="/optics.css" />
   <link rel="stylesheet" href="/hugeicons.css" />
   <link rel="stylesheet" href="/studio.css" />
</head>

<body class="op-page">
   <div class="op-page__sidebar">
      <nav class="sidebar sidebar--drawer">
         <a class="sidebar__brand sidebar__brand--left" href="/">
            <img height="50" width="50" src="/brand-mark.svg" />
         </a>
         <div class="sidebar__content sidebar__content--start">
            <h1>RoleModel Studio</h1>
            <div class="root" id="root">…</div>
            <!--
               The nav in the order the work happens.
               ============================================================
               It used to be thirteen siblings named after subsystems — cut, compose,
               scenes, recast — with nothing to say which came first. Every one of them
               also opened by asking "which project?", so they were all equally step
               one, and the nav could not have been ordered even if somebody had wanted
               to. The project moved to the header, which is what freed this.

               Two groups, because the app has two kinds of panel: nine that work
               inside a project, and five that are about the toolkit and reference
               `S.projects` zero times.

               The headings are SIBLINGS of the buttons, not wrappers around them.
               Optics styles this component through `.sidebar__content > *` in four
               places — the base alignment and all three widths — and `display:
               contents` on a wrapper does not fool a child combinator: it removes the
               box, not the parentage. Grouping them cost the buttons their left
               alignment and, in the rail, the `font-size: 0` that collapses their
               labels. An <h2> gives the grouping real document structure without
               putting anything between the content and its children.
            -->
            <button class="btn btn--no-border" data-v="library" aria-current="true">Library</button>

            <h2 class="navgroup" data-group="make">Make a video</h2>
            <button class="btn btn--no-border" data-group="make" data-v="workflow">Video</button>
            <button class="btn btn--no-border" data-group="make" data-v="voice">Voice</button>
            <button class="btn btn--no-border" data-group="make" data-v="hyperframes">Motion editor</button>
            <h2 class="navgroup">Toolkit</h2>
            <button class="btn btn--no-border" data-v="skills">Skills</button>
            <button class="btn btn--no-border" data-v="brand">Brand</button>
            <button class="btn btn--no-border" data-v="components">Components</button>
            <button class="btn btn--no-border" data-v="storage">Storage</button>
            <button class="btn btn--no-border" data-v="usage">Usage</button>
            <button class="btn btn--no-border" data-v="console">Console<span class="badge" id="jobn"></span></button>
            <div class="tools" id="tools"></div>
         </div>
         <!--
            Docs sit at the bottom, under the tool indicators, in Optics' own
            end-aligned block.
            ============================================================
            A second `.sidebar__content` rather than one more button in the first:
            the base class carries `flex-grow: 1`, so two of them share the free
            space and `--end` pushes this one's content to the floor of the
            sidebar. That is the difference between "last in the list" and "at the
            bottom", and Docs is the second thing — it is not another destination
            in the pipeline, it is where you go when the pipeline has not helped.

            It leaves the app rather than being a view, so `data-v` is deliberately
            absent: the router would try to render a view called "docs" and the nav
            painters would mark it current, leaving the sidebar highlighting a page
            you are not on.
         -->
         <div class="sidebar__content sidebar__content--end">
            <button class="btn btn--no-border" id="docs">Docs</button>
            <!--
               Signing out is an account action, not a storyboard one.
               ============================================================
               It lived in the Storyboard's right-hand rail, beside the sharing
               dial that put it there — which meant the way to sign out was to
               open one particular panel and scroll to the bottom of its
               settings. Who you are is app-wide, so it belongs with the other
               app-wide thing at the floor of the sidebar.

               `hidden` until somebody is signed in: a sign-out button with no
               session behind it is a control that does nothing, permanently.

               No `data-v`, for the same reason Docs has none — the router would
               render a view called "signout" and the nav painters would mark it
               current.
            -->
            <button class="btn btn--no-border" id="signout" hidden>Sign out</button>
         </div>
      </nav>
   </div>

   <div class="op-page__main">
      <header class="op-page__main-header" id="crumbs"></header>
      <aside class="activity" id="activity" aria-live="polite" hidden></aside>
      <main class="op-page__main-content" id="main"></main>
      <footer class="op-page__main-footer"></footer>

      <div id="editor-host" class="editor-host"></div>
   </div>
   <div class="op-page__sidebar op-page__sidebar--right"></div>
   <!--
      Panel markup, as markup.
      ================================================================
      A panel used to be assembled in JavaScript — forty lines of `el('div')` and
      `.append()` per view, where the structure was something you reconstructed by
      reading code rather than something you could see. This is the same structure
      as HTML: the shape is legible, the Optics classes are visible, and changing
      the layout is an edit here instead of a hunt through a 6,000-line file.

      `data-region` says where a block goes — `main` into the page content,
      `side` into Optics' right sidebar, `footer` into its page footer. The last
      two are OUTSIDE `.op-page__main-content`, which is the point: config and
      actions are not part of the thing that scrolls.

      `data-el` is a handle. mountPanel() returns a map of them, so the JS wires
      behaviour to named nodes and never builds any.
   -->
   <!--
      First run: no projects yet.
      ================================================================
      Shown INSTEAD of whatever panel was asked for, because every scoped panel is
      about a project and there is not one — a Scenes page with an empty footage
      shelf and a dead Save button teaches nothing except that the tool is broken.

      The art is assets/empty-state.svg, served through the same static route as
      brand/ and components/. It is decorative — the heading and the steps carry the
      meaning — so the frame is aria-hidden and the img's alt is empty rather than
      describing a picture a screen reader gains nothing from.
   -->
   <template data-panel="firstrun">
      <div data-region="main" class="panel-card firstrun">
         <div class="firstrun__art" aria-hidden="true">
            <img data-el="art" src="/assets/empty-state.svg" alt="" />
         </div>
         <h2 class="firstrun__title">Make your first video</h2>
         <p class="firstrun__lede">
            Everything here happens inside a project — a folder with your footage,
            scripts, scenes and renders in it. Make one and the rest of the app has
            somewhere to put things.
         </p>
         <ol class="firstrun__steps">
            <li><strong>Record or drop in footage.</strong> A screen capture, or files you already have.</li>
            <li><strong>Write the script.</strong> Or describe the video and let Claude draft it.</li>
            <li><strong>Give it a voice.</strong> Narration is synthesised from the script.</li>
            <li><strong>Build the scenes.</strong> Titles, callouts and brand boards.</li>
            <li><strong>Assemble and review.</strong> Cut it together, then share it.</li>
         </ol>
      </div>
      <div data-region="footer">
         <div data-el="status" class="hint"></div>
         <button data-el="start" class="btn">Create a project</button>
      </div>
   </template>

   <template data-panel="components">
      <p class="lede" data-region="main">
         Custom elements for HyperFrames scenes: title cards, browser chrome, lower
         thirds, callouts, stats, build-on lists. Drag the scrubber in the frame —
         the page is seeked to that instant, which is exactly what the renderer does
         frame by frame.
      </p>
      <div data-region="main">
         <iframe data-el="gallery" class="tall-frame" src="/components/gallery.html" title="Component gallery"></iframe>
         <pre class="cmd-note">node components/render-scene.mjs components/scene.html -o demo.mp4 --fps 30</pre>
      </div>
      <div data-region="footer">
         <button data-el="openTab" class="btn">Open in a tab</button>
         <button data-el="openScene" class="btn ghost">Open the scene template</button>
      </div>
   </template>

   <template data-panel="new">
      <p class="lede" data-region="main">
         A project is a folder with a manifest. Client is separate from project name
         — Ridgeline and Hershey are two clients, not one project.
      </p>
      <div data-region="side">
         <div class="form-group">
            <label class="form-label" for="new-name">Project</label>
            <input data-el="name" id="new-name" class="form-control" placeholder="Railing Case Study" />
         </div>
         <div class="form-group">
            <label class="form-label" for="new-client">Client</label>
            <input data-el="client" id="new-client" class="form-control" placeholder="Ridgeline" />
         </div>
         <div class="form-group">
            <label class="form-label" for="new-brand">Brand</label>
            <select data-el="brand" id="new-brand" class="form-control"></select>
         </div>
         <div class="form-group">
            <label class="form-label" for="new-store">Storage</label>
            <select data-el="store" id="new-store" class="form-control"></select>
         </div>
         <div class="form-group">
            <label class="form-label" for="new-bucket">Bucket</label>
            <input data-el="bucket" id="new-bucket" class="form-control" placeholder="rm-video (remote only)" />
         </div>
      </div>
      <div data-region="footer">
         <pre data-el="status" class="status" hidden></pre>
         <button data-el="go" class="btn">Create project</button>
      </div>
   </template>

   <!--
      Three ways in, as three cards.
      ================================================================
      This was a row of chips above whichever panel was active, so the choice and
      the work competed for the same screen and the two you did not pick sat there
      taking width. A picture says which is which faster than three similar
      sentences do — and the difference between recording a screen, writing a
      script and replaying a test is exactly the kind that is easier shown.

      The chooser is what you see with nothing picked; picking one replaces it, and
      the breadcrumb is the way back. `<img>` with an empty alt because the name is
      right beneath it in text — reading the picture out as well would say it twice.
   -->
   <template data-panel="create">
      <p class="lede" data-region="main">
         Three ways to start. Record what you do, write it and let the browser act
         it out, or replay a test you already have.
      </p>
      <div data-el="chooser" data-region="main" class="choose-grid">
         <button class="choose-card" data-tab="record">
            <img src="/assets/screen-recording.svg" alt="" />
            <span class="choose-card__name">Record a screen</span>
            <span class="choose-card__note">Capture what you do, as you do it.</span>
         </button>
         <button class="choose-card" data-tab="make">
            <img src="/assets/script.svg" alt="" />
            <span class="choose-card__name">Make from a script</span>
            <span class="choose-card__note">Write the demo; the browser performs it.</span>
         </button>
         <button class="choose-card" data-tab="recast">
            <img src="/assets/test.svg" alt="" />
            <span class="choose-card__name">From a test</span>
            <span class="choose-card__note">Replay a Playwright run you already have.</span>
         </button>
      </div>
      <div data-el="host" data-region="main"></div>
   </template>

   <template data-panel="scripts">
      <p class="lede" data-region="main">
         Narration and outlines as markdown — greppable, and they diff. A script
         saved to a project lands in that project's scripts/ folder; the shared
         shelf is for the ones that travel. Voice reads from here.
      </p>

      <div data-region="main" class="panel-card script-form">
         <div class="form-group">
            <label class="form-label" for="script-about">About</label>
            <textarea data-el="about" id="script-about" class="form-control" rows="3"
               placeholder="A URL, or a couple of sentences about what the video is for and who is watching."></textarea>
            <div class="form-hint">The brief Claude drafts from. Type / for a directive.</div>
         </div>

         <div class="form-group">
            <label class="form-label" for="script-body">Script</label>
            <textarea data-el="body" id="script-body" class="form-control script-body" spellcheck="false"
               placeholder="Write the script…"></textarea>
            <div data-el="count" class="form-hint"></div>
			<div class="form-hint">Type <code>/speaker "Name"</code> before a section to assign it to that person. Claude keeps those sections with that person’s named footage.</div>
         </div>

         <div data-el="draftOut"></div>
      </div>

      <!--
         The rail is the settings and the shelf.
         Main is where you write; the name, the length and where it saves are knobs
         about the thing being written, not the thing itself.
      -->
      <div data-region="side">
         <div class="form-group">
            <label class="form-label" for="script-name">Name</label>
            <input data-el="name" id="script-name" class="form-control" placeholder="case-study-opener" />
            <div class="form-hint">The filename, without .md. Voice matches a narration run to a script by this.</div>
         </div>
         <div class="form-group">
            <label class="form-label" for="script-shelf">Save to</label>
            <select data-el="shelf" id="script-shelf" class="form-control">
               <option value="project">This project</option>
               <option value="shared">Shared shelf</option>
            </select>
            <div class="form-hint">
               A project script lands in its scripts/ folder. The shared shelf is for the
               ones that travel between projects.
            </div>
         </div>
         <div class="form-group">
            <label class="form-label" for="script-seconds">Seconds</label>
            <input data-el="seconds" id="script-seconds" class="form-control" type="number" value="30" min="10" max="180"
               step="5" />
            <div class="form-hint">How long the draft should run. Drafting only.</div>
         </div>

         <div class="client">Saved</div>
         <div data-el="saved" class="saved-list"></div>
      </div>

      <div data-region="footer">
         <div data-el="status" class="hint"></div>
         <button data-el="draft" class="btn ghost">Draft it with Claude</button>
         <button data-el="save" class="btn">Save script</button>
         <button data-el="build" class="btn btn--primary">Build with Claude</button>
      </div>
   </template>

   <template data-panel="scenes">
      <p class="lede" data-region="main">
         A scene is a stage with parts on it. Add a part, fill it in, watch it.
         Everything is seeked rather than played, so what you scrub to is what
         gets encoded.
      </p>

      <div data-region="main" class="panel-card panel-stage">
         <iframe data-el="frame" class="scene-frame" title="Scene preview"></iframe>
         <div class="row">
            <input data-el="scrub" class="form-control" type="range" min="0" max="8000" step="16" value="0"
               aria-label="Scrub the scene" />
            <span data-el="time" class="path">0 ms</span>
         </div>
         <div data-el="palette" class="row">
            <span class="path">Add a part</span>
         </div>
         <div data-el="cards" class="panel-cards"></div>
         <!-- Visible because an editor that cannot show its output is one nobody
              can debug; collapsed because it is no longer the thing you work in. -->
         <details data-el="raw">
            <summary>Markup</summary>
            <textarea data-el="rawText" class="form-control" rows="6" spellcheck="false"></textarea>
         </details>
      </div>

      <div data-region="side">
         <div class="form-group">
            <label class="form-label" for="scene-pick">Scene</label>
            <select data-el="pick" id="scene-pick" class="form-control"></select>
            <div class="form-hint">Saved in the project under scenes/.</div>
         </div>
         <div class="form-group">
            <label class="form-label" for="scene-name">Name</label>
            <input data-el="name" id="scene-name" class="form-control" placeholder="opening-card" />
         </div>
         <div class="form-group">
            <label class="form-label" for="scene-wallpaper">Wallpaper</label>
            <select data-el="wallpaper" id="scene-wallpaper" class="form-control"></select>
         </div>
         <div class="form-group">
            <label class="form-label" for="scene-brand">Brand</label>
            <select data-el="brand" id="scene-brand" class="form-control">
               <option value="">RoleModel — DM Sans</option>
               <option value="academy">Craftsmanship Academy — Space Grotesk</option>
            </select>
            <div class="form-hint">Academy scenes set in Space Grotesk. RoleModel keeps DM Sans.</div>
         </div>
         <div class="form-group">
            <label class="form-label">Accent</label>
            <div data-el="accent"></div>
            <div class="form-hint">The brand colour the parts pick up. Leave it unset for the preset default.</div>
         </div>
         <div class="form-group">
            <label class="form-label" for="scene-brief">Ask Claude for one</label>
            <textarea data-el="brief" id="scene-brief" class="form-control" rows="3"
               placeholder="What is this scene? One or two sentences."></textarea>
         </div>
         <div data-el="footageGroup" class="form-group" hidden>
            <label class="form-label" for="scene-footage">Footage for this Canvas shot</label>
            <select data-el="footage" id="scene-footage" class="form-control"></select>
            <div class="row">
               <button data-el="transcribeFootage" type="button" class="btn btn--small">Transcribe</button>
               <button data-el="suggestFootage" type="button" class="btn ghost btn--small">Ask Claude to find it</button>
               <button data-el="attachFootage" type="button" class="btn ghost btn--small">Use whole file</button>
               <button data-el="addFootage" type="button" class="btn ghost btn--small">Add video</button>
               <input data-el="footagePicker" type="file" accept="video/*" hidden />
            </div>
            <div data-el="footageHint" class="form-hint"></div>
            <section data-el="footageReview" class="scene-footage-review" hidden>
               <video data-el="footagePlayer" class="scene-footage-review__player" controls playsinline preload="metadata"></video>
               <div data-el="footageReviewStatus" class="form-hint"></div>
               <div data-el="footageTranscript" class="scene-footage-review__transcript"></div>
            </section>
         </div>
      </div>

      <div data-region="footer">
         <pre data-el="status" class="status" hidden></pre>
         <button data-el="draft" class="btn">Draft it with Claude</button>
         <button data-el="save" class="btn ghost">Save scene</button>
      </div>
   </template>

   <script src="/studio.js"></script>
</body>

</html>
