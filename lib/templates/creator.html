<!-- Creator: gradients, shaders, glass, dither, halftone, ASCII, grain — one look. -->
<template data-panel="creator">
   <p class="lede" data-region="main">One background, every treatment: a gradient with warp and flow, then waves, blobs, light, fluted glass, optics, pixels, dither, halftone, a grid, ASCII and grain. One seekable WebGL pass, so a frame is always the same frame. Copy it into Framer, save it as a scene, export a PNG.</p>
   <div class="wpprev creator__stage" data-region="main">
      <rm-scene assets="/brand/imagery"><rm-look data-el="look" at="0" for="60000"></rm-look></rm-scene>
   </div>
   <div class="ctl" data-region="main">
      <button data-el="play" class="btn ghost" type="button"><rm-icon name="play"></rm-icon>Play</button>
      <input data-el="scrub" type="range" min="0" max="20000" step="20" value="0" class="form-control" />
      <span data-el="clock" class="v">0 ms</span>
   </div>
   <div class="client" data-region="main">Presets</div>
   <div data-el="presets" class="grid creator__presets" data-region="main"></div>
   <div class="client" data-region="main">Saved looks <span data-el="savedCount" class="creator__soft"></span></div>
   <p data-el="savedEmpty" class="hint" data-region="main">Nothing saved yet. Press Save look and it is kept for the team.</p>
   <div data-el="saved" class="grid creator__presets" data-region="main"></div>
   <div class="client" data-region="main">The look</div>
   <p class="hint" data-region="main">This string is the whole design. Add to Framer puts a RoleModelLook component on the canvas with it filled in; paste one into this box to load it.</p>
   <textarea data-el="lookText" class="form-control creator__looktext" rows="3" spellcheck="false" data-region="main"></textarea>
   <pre data-el="markup" class="cmd-note" data-region="main"></pre>
   <!-- Buttons only in the footer, like every other panel. Settings — the PNG's
        width and shape, the composition to insert into — live in the rail. -->
   <div class="grid" data-region="footer">
      <button data-el="copyLook" class="btn ghost" type="button"><rm-icon name="copy-01"></rm-icon>Copy look</button>
      <button data-el="toFramer" class="btn ghost" type="button"><rm-icon name="code"></rm-icon>Add to Framer</button>
      <button data-el="png" class="btn ghost" type="button"><rm-icon name="image-download"></rm-icon>Save PNG</button>
      <button data-el="save" class="btn btn--primary" type="button"><rm-icon name="bookmark-02"></rm-icon>Save look</button>
   </div>
</template>

<!-- A preset or a saved look: a still of the look, rendered once. Not a live
     element — twelve shaders redrawing on every frame is what made the page drag. -->
<template data-row="creator-preset">
   <button class="card creator__preset" type="button">
      <div class="thumb creator__thumb"><img data-el="art" class="creator__thumbimg" alt="" /></div>
      <div class="card__body"><input data-el="name" class="creator__name" type="text" aria-label="Name" readonly /></div>
   </button>
</template>

<!-- One gradient stop: the brand colour picker, and where it sits. -->
<template data-row="creator-stop">
   <div class="creator__stop">
      <span data-el="pick" class="creator__pick"></span>
      <button data-el="remove" class="btn ghost btn--small" type="button" aria-label="Remove stop">×</button>
      <input data-el="pos" class="form-control" type="range" min="0" max="100" step="1" aria-label="Position" />
      <span data-el="readout" class="v"></span>
   </div>
</template>

<!-- The stops list: one stop per row, unlike the two-up dial grid. -->
<template data-row="creator-stops"><div class="creator__stops"></div></template>

<!-- The picture: an upload, kept in the library's added assets like a brand mark. -->
<template data-row="creator-picture">
   <label data-el="label" class="form-label">Picture</label>
   <div class="creator__picture">
      <button data-el="pick" class="btn ghost btn--small" type="button"><rm-icon name="upload-04"></rm-icon>Upload</button>
      <span data-el="name" class="path creator__picturename"></span>
      <button data-el="clear" class="btn ghost btn--small" type="button" hidden>Clear</button>
      <input data-el="file" type="file" accept="image/*" hidden />
   </div>
</template>

<!-- A yes/no dial is a switch, like every other yes/no in the rail. -->
<template data-row="creator-toggle">
   <label data-el="label" class="form-label"></label>
   <div class="switch switch--small creator__check">
      <input data-el="input" type="checkbox" />
      <label data-el="track"></label>
   </div>
</template>

<!-- A section heading with the switch that turns its whole group on. The dials
     under it stay hidden until the switch is on: a rail of forty controls is a
     wall, a rail of the six you asked for is a tool. -->
<template data-row="creator-sec">
   <div class="sec creator__sec">
      <span data-el="title"></span>
      <div class="switch switch--small creator__check">
         <input data-el="input" type="checkbox" />
         <label data-el="track"></label>
      </div>
   </div>
</template>
