<!-- Console: background jobs and their output. -->
<template data-panel="console">
   <!-- Nothing above the list until there is a list: the lede explains a
        running job's output and the footer Clear acts on jobs; with none of
        either, the empty state says the useful thing by itself. -->
   <p data-el="lede" class="lede" data-region="main">Everything the Studio runs, as it runs. Output is live — you don't have to go find a terminal to see whether the export worked.</p>
   <div class="con" data-region="main">
      <div data-el="list" class="joblist"></div>
      <div data-el="status" class="hint"></div>
      <div class="runrow">
         <button data-el="stop" class="btn ghost" type="button" hidden><rm-icon name="stop"></rm-icon>Stop</button>
          <button data-el="rerun" class="btn ghost" type="button" hidden><rm-icon name="repeat"></rm-icon>Run again</button>
      </div>
      <div data-el="log" class="log"></div>
      <div data-el="ranIn" class="path" hidden></div>
      <div data-el="nothing" class="hint" hidden>Nothing was written there.</div>
      <div data-el="fileBox" class="log__files" hidden><div data-el="fileCount" class="crumb"></div></div>
      <div data-el="cmd" class="cmd" hidden><input data-el="cmdInput" placeholder="openscreen info --json" /><button data-el="cmdRun" class="btn" type="button"><rm-icon name="play"></rm-icon>Run</button></div>
   </div>
   <!-- After the list rather than above it: a destructive control at the top
        is one you reach before reading what it would remove. -->
   <div data-region="footer">
      <button data-el="clear" class="btn ghost" type="button" title="Forget every job that has finished, and its saved output. Running jobs stay."><rm-icon name="delete-02"></rm-icon>Clear finished</button>
   </div>
</template>

<template data-row="console-empty">
   <div class="empty" style="padding:var(--op-space-large)">Nothing has run yet.</div>
</template>

<template data-row="console-job">
   <div class="job"><div data-el="label" class="jl"></div><div data-el="state" class="js"></div></div>
</template>

<!-- One log line; attach() sets its class per stream. -->
<template data-row="console-line">
   <div></div>
</template>

<template data-row="console-file">
   <div class="job"><div class="ent"><div data-el="name" class="nm2"></div><div data-el="tag" class="tag"></div></div></div>
</template>
