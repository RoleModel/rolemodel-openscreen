<!-- Bare controls cloned through control(kind). -->
<!-- Bare controls, cloned by control(kind). A control handed to field() gets
     its group, label and .form-control class there; nothing is born in JS. -->
<template data-row="control-input"><input /></template>

<template data-row="control-number"><input type="number" /></template>

<template data-row="control-select"><select></select></template>

<template data-row="control-textarea"><textarea></textarea></template>

<template data-row="control-hint"><div class="hint"></div></template>

<template data-row="control-button"><button class="btn" type="button"></button></template>

<template data-row="control-full"><div class="full"></div></template>

<template data-row="control-empty"><p class="empty"></p></template>

<template data-row="control-pre"><pre class="full"></pre></template>

<template data-row="control-link"><a></a></template>

<template data-row="control-row"><div class="row"></div></template>

<template data-row="control-path"><div class="path"></div></template>

<template data-row="control-status"><div class="form-hint full"></div></template>

<template data-row="control-form"><div class="form"></div></template>

<template data-row="control-client"><div class="client"></div></template>

<template data-row="control-span"><span></span></template>

<template data-row="control-div"><div></div></template>

<template data-row="control-preformatted"><pre></pre></template>

<template data-row="control-status-line"><p class="runrow__status hint" hidden></p></template>

<template data-row="control-audio"><audio></audio></template>

<template data-row="control-img"><img alt="" loading="lazy" /></template>
