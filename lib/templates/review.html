<!-- Review: sharing cuts through OpenFrame. -->
<template data-panel="review">
   <div data-el="status" class="hint" data-region="main"></div>
   <div data-el="body" data-region="main"></div>
</template>

<template data-row="review-note">
   <div class="note"><p>OpenFrame is where a client leaves timestamped notes on a video. It runs itself — bring it up with Docker, then point this at it.</p></div>
</template>

<template data-row="review-link">
   <div class="runrow">
      <code data-el="url"></code>
      <button data-el="copy" class="btn ghost" type="button">Copy link</button>
      <button data-el="open" class="btn ghost" type="button">Open</button>
   </div>
</template>

<!-- One video out for review: art, facts, and a row of icon actions. -->
<template data-row="review-card">
   <div class="card">
      <div data-el="art" class="projcard__art" hidden></div>
      <div class="body">
         <div data-el="title" class="nm"></div>
         <div data-el="where" class="path"></div>
         <div data-el="facts" class="path"></div>
         <div data-el="acts" style="display:flex;gap:var(--op-space-2x-small);flex-wrap:wrap">
            <button data-el="checkIt" class="btn ghost" type="button" title="Check for feedback" aria-label="Check for feedback"></button>
            <button data-el="openIt" class="btn ghost" type="button" title="Open in OpenFrame" aria-label="Open in OpenFrame"></button>
            <button data-el="copyIt" class="btn ghost" type="button" title="Copy link" aria-label="Copy the share link"></button>
         </div>
         <div data-el="state" class="hint"></div>
         <div data-el="why" class="hint"></div>
      </div>
   </div>
</template>
