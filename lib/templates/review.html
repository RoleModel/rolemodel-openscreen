<!-- Review: a finished video as a page of our own, with notes on the frame. -->
<template data-panel="review">
   <p class="lede" data-region="main">Share a render as a page on our own storage. Whoever has the link watches it there and leaves notes pinned to the moment they are about. The notes come back here, and a page comes down when it has served its purpose.</p>
   <div data-el="status" class="hint" data-region="main"></div>
   <p data-el="noStorage" class="hint" data-region="main" hidden>No storage remote has a public bucket and base URL yet. Set one under Storage, then come back.</p>
   <p data-el="noNotes" class="hint" data-region="main" hidden>There is no team database, so pages will have no notes. Set the database under Storage to turn them on.</p>
   <!-- Renders in this project, each with a Share button. -->
   <div class="client" data-region="main">Renders <span data-el="renderCount" class="review__soft"></span></div>
   <p data-el="rendersEmpty" class="hint" data-region="main" hidden>No videos in this project yet. Render one, or add a video to the project's media.</p>
   <div data-el="renders" class="grid review__grid" data-region="main"></div>
   <!-- Pages already out, with their notes. -->
   <div class="client" data-region="main">Shared pages <span data-el="shareCount" class="review__soft"></span></div>
   <p data-el="sharesEmpty" class="hint" data-region="main" hidden>Nothing shared from this project yet.</p>
   <div data-el="shares" class="grid review__grid" data-region="main"></div>
</template>

<!-- One render of the project, ready to share. -->
<template data-row="review-render">
   <div class="card card--media review__card">
      <div class="thumbwrap"><div data-el="art" class="thumb review__thumb"></div></div>
      <div class="card__body">
         <div data-el="name" class="path review__name"></div>
         <div data-el="facts" class="path"></div>
         <div class="review__acts">
            <input data-el="title" class="form-control review__title" placeholder="Title for the page" />
            <button data-el="share" class="btn btn--primary btn--small" type="button"><rm-icon name="share-08"></rm-icon>Share</button>
            <button data-el="copy" class="btn ghost btn--small" type="button" hidden><rm-icon name="copy-01"></rm-icon>Copy link</button>
         </div>
         <div data-el="out" class="hint"></div>
      </div>
   </div>
</template>

<!-- One page out there: poster, facts, notes, and the actions on it. -->
<template data-row="review-share">
   <div class="card card--media review__card">
      <div class="thumbwrap"><div data-el="art" class="thumb review__thumb"></div></div>
      <div class="card__body">
         <div data-el="name" class="nm"></div>
         <div data-el="facts" class="path"></div>
         <a data-el="link" class="review__link" target="_blank" rel="noopener">Open the page</a>
         <div class="review__acts">
            <button data-el="copy" class="btn ghost btn--small" type="button"><rm-icon name="copy-01"></rm-icon>Copy link</button>
            <button data-el="notes" class="btn ghost btn--small" type="button"><rm-icon name="comment-01"></rm-icon>Notes</button>
            <button data-el="again" class="btn ghost btn--small" type="button" title="Publish the page again from the same render"><rm-icon name="refresh"></rm-icon>Republish</button>
            <span data-el="acts"></span>
         </div>
         <div data-el="thread" class="review__thread" hidden></div>
      </div>
   </div>
</template>

<!-- One note, in the Studio's own list. -->
<template data-row="review-note">
   <div class="review__note">
      <div class="review__notehead"><b data-el="at" class="review__at"></b><b data-el="who"></b><time data-el="when" class="review__when"></time><button data-el="tidy" class="review__tidy" type="button" title="Remove this note" aria-label="Remove this note">×</button></div>
      <p data-el="body" class="review__notebody"></p>
   </div>
</template>
