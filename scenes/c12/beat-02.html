<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>C12 — Live Activity</title>
<link rel="stylesheet" href="../../brand/fonts/fonts.css" />
<link rel="stylesheet" href="../../brand/optics/optics.css" />
<link rel="stylesheet" href="../../brand/optics/rolemodel-scales.css" />
<style>
  :root{color-scheme:dark}
  html,body{margin:0;background:var(--op-color-neutral-plus-max)}
  body{display:grid;place-items:center;min-height:100vh}
  #stage{width:100vw;max-width:calc(100vh * 16 / 9)}
</style>
</head>
<body>
  <div id="stage">
    <rm-scene wallpaper="../../brand/wallpapers/rm-dark-dotgrid">

      <!-- The phone is a showcase, so the milled rail, the glass bevel, the
           island and the lean all come from the component rather than from a
           picture that already has a shell drawn into it. Feed it the CHROMELESS
           screen: a framed picture inside a frame is a phone in a phone. -->
      <rm-showcase at="0" for="5640" device="phone" frame="dark" look="none"
        media="https://rolemodel.github.io/rolemodel-ux-audit-projects/c12/prototype/shots-screen-3x/S02.png"
        pad="16" shadow="0.8" tx="6" ty="-38" persp="170" x="24" zoom="1"></rm-showcase>

      <!-- And the words are a layer, placed where they belong, leaving before
           the push-in. This is what used to be a div and four keyframes. -->
      <rm-text at="200" for="3040"
        x="7" y="47" anchor="left" w="32"
        text="Forum day, live" sub="on the Lock Screen"
        size="4.4" subsize="1.5" weight="700" stagger="word" step="55"></rm-text>

    </rm-scene>
  </div>

  <script type="module">
    import { RM } from "../../components/rm-video.js";
    await RM.ready();
    RM.seek(0);
    if (!window.__hyperframes) {
      const total = RM.duration();
      const t0 = performance.now();
      const tick = () => { RM.seek((performance.now() - t0) % total); requestAnimationFrame(tick); };
      tick();
    }
  </script>
</body>
</html>
