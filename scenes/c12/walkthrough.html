<!--
  Seventeen beats, cut to the voice-over.

  Every start and length here is measured, not guessed: the narration was
  transcribed to word level and each beat runs from the first word of its
  sentence to the first word of the next one. That is why the numbers are odd
  -- 3380, 4850, 4190 -- and why they must stay odd. Re-record the voice and
  they are all wrong together; re-measure, do not nudge.

  Each beat is two layers and nothing else: a phone, and the words beside it.
  The screens are CHROMELESS on purpose -- rm-showcase draws the device, so a
  picture that already has one is a phone in a phone.

  The words leave 1.6s before the cut, which is the room the push-in needs.

  Every phone states exit="fade". The dial defaults to "stay", which is right
  for a single shot and wrong for seventeen: a layer that never leaves is still
  there under the next one, so by the end the film was a stack of seventeen
  phones with the newest on top, and the closing card was printed over the one
  before it. In a cut, a layer has to go.
-->

<script type="module">
  import { RM } from "../../components/rm-video.js";
  await RM.ready();
  /*
   * ?t=<ms> parks the film on one frame and leaves it there.
   *
   * Without it a scene opened by hand runs its own clock off performance.now(),
   * so a headless screenshot lands wherever the page happened to be when the
   * shutter went -- every check of "does beat nine read" came back with
   * whatever beat was passing. A stated time is the same frame every run, which
   * is the whole point of seeking rather than playing.
   */
  const want = Number(new URLSearchParams(location.search).get("t"));
  if (Number.isFinite(want) && want > 0) {
    RM.seek(want);
    window.__parked = want;
  } else {
    RM.seek(0);
    if (!window.__hyperframes) {
      const total = RM.duration();
      const t0 = performance.now();
      const tick = () => { RM.seek((performance.now() - t0) % total); requestAnimationFrame(tick); };
      tick();
    }
  }
</script>
