<!-- THE brand mark. One file, and the only place it is defined.
     It was a percent-encoded data: URI inlined twice in lib/studio.html and scraped
     back out with a regex by lib/make-icon.mjs, with a third hand-copied version in
     the fork. Three copies of one drawing, none of them editable.
     Everything downstream is generated from this: the Studio's favicon and sidebar
     (served at /brand-mark.svg), the app's .icns and PNG set, and the editor's top
     bar. Change it here and run `npm run icon`.
     No width/height on purpose: every caller sizes it. -->
