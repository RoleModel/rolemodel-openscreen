<!--
  Slack's mark, without the wordmark that comes with the full lockup.

  The button already says "Sign in with Slack", so the lockup made it read
  "slack Sign in with Slack". The viewBox is cropped to the glyph, and the four
  colours are kept as they are: that is the only way Slack's mark may be shown,
  and the only way it is recognisable at the size of a button.
-->
