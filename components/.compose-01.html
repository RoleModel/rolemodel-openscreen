<script type="module">
  import { RM } from "./rm-video.js";
  const footage = document.querySelector('[data-rm-footage]');
  const footageStart = Number(footage?.dataset.rmFootageStart || 0);
  const footageEnd = Number(footage?.dataset.rmFootageEnd || 0);
  const seekFootage = (ms) => {
    if (!footage || footage.readyState < HTMLMediaElement.HAVE_METADATA) return;
    const requested = footageStart + Math.max(0, Number(ms) || 0) / 1000;
    const duration = Number.isFinite(footage.duration) ? footage.duration : Infinity;
    const limit = footageEnd > footageStart ? Math.min(footageEnd, duration) : duration;
    const time = Math.max(footageStart, Math.min(requested, limit));
    if (Number.isFinite(time) && Math.abs(footage.currentTime - time) > 0.025) footage.currentTime = time;
  };
  if (footage) {
    document.documentElement.addEventListener('rmseek', (event) => seekFootage(event.detail));
    footage.addEventListener('loadedmetadata', () => seekFootage(RM.t), { once: true });
    seekFootage(RM.t);
  }
