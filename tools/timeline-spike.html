<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>timeline</title>
<style>
  :root { color-scheme: dark }
  html, body { margin: 0; background: #0b0f14; color: #d7dee6;
               font: 13px/1.5 ui-monospace, Menlo, monospace; }
  #bar { display: flex; gap: 18px; align-items: center; padding: 12px 16px; color: #7c8894; }
  #bar b { color: #d7dee6; font-weight: 500; }
  #wrap { padding: 0 16px 16px; }
  canvas { display: block; width: 100%; touch-action: none; }
</style></head>
<body>
  <div id="bar">
    <span>zoom <b id="zoom"></b></span>
    <span>playhead <b id="head"></b></span>
    <span>selected <b id="sel">—</b></span>
    <span>paint <b id="ms"></b></span>
    <span id="hint">drag a clip · drag its edge to trim · drag the ruler to scrub · wheel to zoom</span>
  </div>
  <div id="wrap"><canvas id="tl"></canvas></div>

<script type="module">
import { paintTimeline, paletteFrom, framesInView, heightFor } from '/lib/timeline-canvas.js';
import { attachTimeline } from '/lib/timeline-input.js';

const canvas = document.getElementById('tl');
const palette = paletteFrom(document.body);
const cut = await (await fetch('/cut.json')).json();

/* Each source carries the shape of its own filmstrip, so the painter can place
   frames without asking the server anything mid-drag. */
for (const key of Object.keys(cut.sources)) {
  Object.assign(cut.sources[key], await (await fetch(`/cache/strip/${key}/index.json`)).json());
}
const peaks = new Map();
for (const key of Object.keys(cut.sources)) {
  peaks.set(key, await (await fetch(`/cache/peaks/${key}.json`)).json());
}
/* An audio lane off the same clips, so there is a waveform to edit against. */
cut.tracks.push({ id: 'a1', kind: 'audio', clips: cut.tracks[0].clips.map((c) => ({ ...c, id: `${c.id}-a` })) });

const view = { pxPerSecond: 22, scrollSeconds: 0 };
const state = { playhead: 12, selection: null, hover: null, snapped: null };
const images = new Map();

/* Fetch only what the view can see, and never inside the paint — a drag must
   not be able to wait on the network. */
let loading = false;
async function fill() {
  if (loading) return;
  loading = true;
  const want = framesInView(cut, view, canvas.clientWidth).filter(({ source, index }) => !images.has(`${source}:${index}`));
  await Promise.all(want.map(({ source, index }) => new Promise((done) => {
    const img = new Image();
    img.onload = img.onerror = () => { draw(); done(); };
    img.src = `/cache/strip/${source}/${String(index + 1).padStart(5, '0')}.jpg`;
    images.set(`${source}:${index}`, img);
  })));
  loading = false;
}

/* One paint per frame however many events arrive. */
let pending = false;
let last = 0;
function draw() {
  if (pending) return;
  pending = true;
  requestAnimationFrame(() => {
    pending = false;
    const t0 = performance.now();
    paintTimeline(canvas, { cut, palette, view, images, peaks, playhead: state.playhead, selection: state.selection });
    last = performance.now() - t0;
    document.getElementById('zoom').textContent = `${view.pxPerSecond.toFixed(0)} px/s`;
    document.getElementById('head').textContent = `${state.playhead.toFixed(2)}s`;
    document.getElementById('sel').textContent = state.selection ?? '—';
    document.getElementById('ms').textContent = `${last.toFixed(2)}ms`;
  });
}

attachTimeline(canvas, {
  cut, view, state,
  onChange: () => { draw(); fill(); },
  onView: draw,
  commit: (gesture) => { window.__lastCommit = { kind: gesture.kind, id: gesture.clip?.id, before: gesture.before,
                                                 after: { in: gesture.clip.in, out: gesture.clip.out, at: gesture.clip.at } }; },
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const before = (e.offsetX - 116) / view.pxPerSecond + view.scrollSeconds;
  view.pxPerSecond = Math.min(400, Math.max(4, view.pxPerSecond * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
  /* Keep the second under the cursor under the cursor. */
  view.scrollSeconds = Math.max(0, before - (e.offsetX - 116) / view.pxPerSecond);
  draw(); fill();
}, { passive: false });

await fill();
draw();

/* For the harness to drive without a mouse. */
window.__tl = { cut, view, state, draw, fill, paintMs: () => last, heightFor: () => heightFor(cut) };
document.title = 'ready';
</script>
</body></html>
